services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VER: 24-alpine
    tty: true
    volumes:
      - ./frontend:/home/node/app/frontend
      - node_modules:/home/node/app/node_modules
    depends_on:
      - php

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
      args:
        SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
        SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
        TMDB_API_KEY: ${TMDB_API_KEY}
    expose:
      - "9000"
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}

volumes:
  node_modules: